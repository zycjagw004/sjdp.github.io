<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合素质页面</title>
    <script src="./echarts.min.js"></script>
    <script src="./jquery.min.js"></script>
</head>

<body style="margin: 0;">
    <!-- div 标签中我们是对窗口进行分区DOM容器 -->
    <div id="scoreBox"
        style="width: 100vw;height: 100vh;background: url(./全国高职院校状态总览图片/bcg.png);background-size: 100% 100%;position: fixed;">

        <div id="scoreTitle" style="width: 100vw;height: 10vh;display: flex;justify-content: space-between;">
            <!-- background-color: aquamarine; -->
            <!-- cursor: pointer; 鼠标显示手形状-->
            <div id="backup"
                style="width: 5vw;height: 5vh;background-color:rgba(81, 139, 219, 0.863);display: flex;justify-content: center;align-items: center; font-size: 20px;color: white;cursor: pointer;"
                onclick="backup()">
                返回
            </div>
            <div id="titleText"
                style="width: 95vw;height: 10vh; display: flex;justify-content: center;align-items: center;font-size: 30px;color: white;background:url(./全国高职院校状态总览图片/title.png);background-size: 100% 100%;">
            </div>

        </div>
        <div id="scoreConten" style="width: 100vw;height: 90vh;display: flex;justify-content: space-between;">
            <div id="scoreLeft"
                style="width: 30vw;height: 90vh;background-color: rgba(170, 179, 170, 0.096);color: white;border: solid;border-width: 0.4vh;">
            </div>
            <div id="scoreCenter"
                style="width: 33.5vw;height: 90vh;background-color: rgba(170, 179, 170, 0.096);color: white;border: solid;border-width: 0.4vh;">
            </div>
            <div id="scoreRight"
                style="width: 33.5vw;height: 90vh;background-color: rgba(170, 179, 170, 0.096);color: white;border: solid;border-width: 0.4vh;">
            </div>
        </div>

    </div>


    <!-- 在下面写js中的语句 -->
    <script>

        function backup () {
            // window.open("http://127.0.0.1:5500/class.html")    // 新打开一个窗口 或者 重新打开一个窗口
            window.location.replace("http://127.0.0.1:5500/class.html")
        }

        // 通过窗口的应用程序中的本地存储传来的数据来确定对于的 DOM 容器里的文本
        document.getElementById('titleText').textContent = `学生综合素质"${localStorage.ScoreName}"项目总览`
        $.get('./studentData.json', function (ret) {
            var localScoreName = localStorage.getItem('ScoreName')
            var localClassName = localStorage.getItem('className')
            let classData = ret[localClassName]
            // console.log(classData)


            function scoretolat (classData) {
                var scores = {
                    '思想政治': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '身心健康': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '创新创业': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '技术技能': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '志愿服务': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '人文艺术': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                    '劳动实践': { '0-10': 0, '11-20': 0, '21-30': 0, '31-40': 0, '41-50': 0 },
                }
                var zj = classData.length; // 修正拼写错误
                for (var i = 0; i < zj; i++) {
                    var student = classData[i];
                    for (var subject in scores) {
                        var score = student[subject];
                        if (score >= 0 && score <= 10) {
                            scores[subject]['0-10']++;
                        } else if (score > 10 && score <= 20) {
                            scores[subject]['11-20']++;
                        } else if (score > 20 && score <= 30) {
                            scores[subject]['21-30']++;
                        } else if (score > 30 && score <= 40) {
                            scores[subject]['31-40']++;
                        } else if (score > 40 && score <= 50) {
                            scores[subject]['41-50']++;
                        }
                    }
                }
                return scores;
            }
            console.log(scoretolat(classData));   // 显示当前班级各个项目的数值


            // 假设您已经通过 scoretolat 函数得到了统计数据
            var scoreData = scoretolat(classData);

            // 准备折线图的数据
            var labels = Object.keys(scoreData[Object.keys(scoreData)[0]]); // 获取分数段的标签
            var datasets = [];

            // 遍历项目，为每个项目创建一个数据集
            for (var subject in scoreData) {
                var dataset = {
                    // name: localScoreName,
                    data: labels.map(function (name) {
                        return scoreData[localScoreName]
                    }),
                };
                datasets.push(dataset);
            }
            console.log(dataset)   // 查看当前分段的数值


            var mychart7 = echarts.init(document.getElementById('scoreLeft'))
            var option7 = {
                title: {
                    text: `"${localScoreName}"分段数据`,
                    left: 'center',
                    textStyle: {
                        color: 'white',
                        fontSize: 25
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)', // 设置提示框背景色为半透明的黑色
                    textStyle: {
                        color: '#fff' // 设置提示框文本颜色为白色
                    },
                    axisPointer: {          // 鼠标移动到图标上会有 十字跟随鼠标,并且 x、y轴上会显示数据
                        type: 'cross',
                        label: {
                            backgroundColor: "red"      // 显示数据的背景颜色
                        }
                    }
                },
                xAxis: {
                    type: "category",
                    data: labels,
                    name: '分段值',
                    nameGap: 4, // 名称与轴线之间的距离
                    nameTextStyle: {
                        color: '#ffffff', // 这里设置Y轴名称的颜色
                        // 其他文本样式，如 fontSize, fontWeight 等也可以在这里设置
                        fontSize: 14,
                        fontWeight: 'bold'
                    },
                    axisLabel: {
                        show: true,
                        textStyle: {
                            color: '#ffffff' // 这里设置为您想要颜色
                        }
                    },

                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        show: true,
                        textStyle: {
                            color: '#ffffff' // 这里设置为您想要颜色
                        }
                    },
                },
                series: [
                    {
                        type: 'line',
                        data: Object.values(scoreData[localScoreName]),
                    }
                ]
            }
            mychart7.setOption(option7)



            var mychart8 = echarts.init(document.getElementById('scoreCenter'))

            var allSubjects = [
                '思想政治',
                '身心健康',
                '创新创业',
                '技术技能',
                '志愿服务',
                '人文艺术',
                '劳动实践'
            ]

            var echartsData = []

            function ScoreSkzb (classData) {
                var scores = {}
                var totalScore = 0 // 用于存储所有项目的总分
                var zrs = classData.length

                // 初始化所有项目的分数为0
                allSubjects.forEach(function (subject) {
                    scores[subject] = 0
                })

                for (var i = 0; i < zrs; i++) {
                    var student = classData[i]
                    allSubjects.forEach(function (subject) {
                        scores[subject] += student[subject]
                        totalScore += student[subject] // 累加每个项目的成绩到总分中
                    })
                }

                // 计算所有项目的占比
                var subjectPercentages = {}
                allSubjects.forEach(function (subject) {
                    var percentage = (scores[subject] / totalScore) * 100
                    subjectPercentages[subject] = percentage.toFixed(2) // 保留两位小数
                })

                // 将特定项目的数据添加到echartsData中
                if (scores.hasOwnProperty(localScoreName)) {
                    echartsData.push({
                        name: localScoreName,
                        value: [scores[localScoreName], subjectPercentages[localScoreName]]
                    })
                }

                // 计算不属于指定项目的成绩总和
                var otherSubjectsScore = 0
                var otherSubjectsCount = 0
                allSubjects.forEach(function (subject) {
                    if (subject !== localScoreName) {
                        otherSubjectsScore += scores[subject]
                        otherSubjectsCount++
                    }
                })

                // 计算不属于指定项目的成绩占比
                var otherSubjectsPercentage = (otherSubjectsScore / totalScore) * 100
                otherSubjectsPercentage = otherSubjectsPercentage.toFixed(2) // 保留两位小数

                // 将不属于指定项目的成绩合并成一个数据块，并添加到echartsData中
                if (otherSubjectsCount > 0) { // 确保有其他项目存在
                    echartsData.push({
                        name: '其他项目',
                        value: [otherSubjectsScore, otherSubjectsPercentage]
                    })
                }

                return echartsData
            }
            var echartsData = ScoreSkzb(classData)
            // 此时echartsData已经准备好，你可以将其传递给ECharts进行可视化...
            console.log(echartsData)


            var option8 = {
                title: {
                    text: `${localClassName}"${localScoreName}"占总比情况`,
                    left: 'center',
                    textStyle: {
                        color: 'white',
                        fontSize: 25
                    }
                },
                legend: {
                    textStyle: {
                        color: '#fff', // 图例文字颜色
                        fontSize: 14 // 图例文字大小
                    },
                    selectedMode: 'multiple', // 图例选择模式，'single'表示单选，'multiple'表示多选
                    orient: 'vertical', // 图例列表的布局朝向，可选值为'horizontal'或'vertical'
                    left: 'left', // 图例组件离容器左侧的距离
                    top: '10%', // 图例组件离容器上侧的距离
                    backgroundColor: 'rgba(0,0,0,0.3)', // 图例背景色
                    borderRadius: 4, // 图例边框圆角
                    padding: [5, 10] // 图例内边距
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {d}%', // 格式化提示框内容，显示名称、数据、百分比
                    backgroundColor: 'rgba(0,0,0,0.8)', // 设置提示框的背景色为半透明的黑色（rgba中的最后一个参数是透明度，0.8表示80%的不透明度）
                    textStyle: { // 提示框中的文本样式设置
                        color: '#fff' // 设置提示框中文本的颜色为白色
                    },
                    axisPointer: { // 鼠标悬停时，用于指示当前数据点位置的指示器配置
                        type: 'cross', // 指示器的类型，'cross' 表示显示十字准线
                        label: { // 指示器上标签的样式设置
                            backgroundColor: "red" // 设置标签的背景颜色为红色
                        }
                    }
                },
                series: [
                    {
                        type: 'pie',
                        radius: '60%',
                        data: echartsData,
                        // 显示为百分比
                        percent: 'percent',
                        // 设置图例的颜色
                        itemStyle: {
                            normal: {
                                color: function (params) {
                                    // 根据条件设置不同的颜色
                                    if (params.name === '其他项目') {
                                        return 'rgb(79, 231, 117)'; // 其他项目的颜色为红色
                                    } else {
                                        return 'rgb(48, 177, 216)'; // 其他数据项的颜色为绿色
                                    }
                                }
                            }
                        }
                    }
                ]
            }

            mychart8.setOption(option8)


            var mychart9 = echarts.init(document.getElementById('scoreRight'))
            // 定义每个科目的达标值
            const passScores = {
                '思想政治': 4,
                '身心健康': 4,
                '创新创业': 4,
                '技术技能': 4,
                '志愿服务': 8,
                '人文艺术': 4,
                '劳动实践': 4
            };

            // 计算每个科目的达标人数与未达标人数的占比
            function calculatePassRate (classData, passScores) {
                let passCounts = {};
                let totalStudents = classData.length; // 获取总学生数量

                // 初始化每个科目的达标人数为0
                for (let subject in passScores) {
                    passCounts[subject] = {
                        pass: 0, // 达标人数
                        fail: 0, // 未达标人数
                        rate: 0  // 达标率
                    };
                }

                // 遍历学生数据
                for (let i = 0; i < totalStudents; i++) {
                    let student = classData[i];

                    // 遍历科目
                    for (let subject in passScores) {
                        // 检查学生是否在该科目上达标
                        if (student[subject] >= passScores[subject]) {
                            passCounts[subject].pass++; // 达标人数加一
                        } else {
                            passCounts[subject].fail++; // 未达标人数加一
                        }
                    }
                }

                // 计算并设置每个科目的达标率
                for (let subject in passCounts) {
                    passCounts[subject].rate = (passCounts[subject].pass / totalStudents) * 100; // 达标率（百分比）
                }

                return passCounts; // 返回包含达标人数、未达标人数和达标率的对象
            }

            // 调用函数计算每个科目的达标人数与未达标人数的占比
            let passRates = calculatePassRate(classData, passScores);

            // 输出每个科目的达标人数、未达标人数和达标率
            for (let subject in passRates) {
                console.log(`${subject}的达标人数为: ${passRates[subject].pass}`);
                console.log(`${subject}的未达标人数为: ${passRates[subject].fail}`);
                console.log(`${subject}的达标率为: ${passRates[subject].rate.toFixed(2)}%`); // 使用toFixed(2)保留两位小数
            }

            var option9 = {
                title: {
                    text: `${localClassName}"${localScoreName}"达标情况`,
                    left: 'center',
                    textStyle: {
                        color: 'white',
                        fontSize: 25
                    }
                },
                legend: {
                    textStyle: {
                        color: '#fff', // 图例文字颜色
                        fontSize: 14 // 图例文字大小
                    },
                    selectedMode: 'multiple', // 图例选择模式，'single'表示单选，'multiple'表示多选
                    orient: 'vertical', // 图例列表的布局朝向，可选值为'horizontal'或'vertical'
                    left: 'left', // 图例组件离容器左侧的距离
                    top: '10%', // 图例组件离容器上侧的距离
                    backgroundColor: 'rgba(0,0,0,0.3)', // 图例背景色
                    borderRadius: 4, // 图例边框圆角
                    padding: [5, 10] // 图例内边距
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}人 {d}%', // 格式化提示框内容，显示名称、数据、百分比
                    backgroundColor: 'rgba(0,0,0,0.8)', // 设置提示框的背景色为半透明的黑色（rgba中的最后一个参数是透明度，0.8表示80%的不透明度）
                    textStyle: { // 提示框中的文本样式设置
                        color: '#fff' // 设置提示框中文本的颜色为白色
                    },
                    axisPointer: { // 鼠标悬停时，用于指示当前数据点位置的指示器配置
                        type: 'cross', // 指示器的类型，'cross' 表示显示十字准线
                        label: { // 指示器上标签的样式设置
                            backgroundColor: "red" // 设置标签的背景颜色为红色
                        }
                    }
                },
                series: [
                    {
                        type: 'pie',
                        radius: '60%',
                        data: [{ name: '不达标', value: passRates[localScoreName].fail }, { name: '达标', value: passRates[localScoreName].pass }],
                        label: {
                            show: "true",
                            position: "inside",
                            formatter: function (params) {
                                console.log("params", params)
                                var content = `${params.data.name} : ${params.data.value} 人`
                                // 如果达标率为0，则不显示标签
                                if (params.value === 0) {
                                    return '';
                                }
                                return content
                            }
                        }
                    }
                ]
            }
            mychart9.setOption(option9)

        })


    </script>

</body>

</html>
